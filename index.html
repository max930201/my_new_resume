<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>個人履歷網站</title>
  <meta name="description" content="資訊管理系學生的學習歷程與作品集" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/header.css" />
  <link rel="stylesheet" href="css/hero.css" />
  <link rel="stylesheet" href="css/skills.css" />
  <link rel="stylesheet" href="css/about.css" />
  <link rel="stylesheet" href="css/milestones.css" />
  <link rel="stylesheet" href="css/projects.css" />
  <link rel="stylesheet" href="css/contact.css" />
  <link rel="stylesheet" href="css/certificates.css" />
  <link rel="stylesheet" href="css/footer.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <a class="skip-link" href="#main-content">跳至主要內容</a>

  <header id="site-header" class="site-header"></header>

  <main id="main-content">
    <section id="hero" class="hero" aria-labelledby="hero-name">
      <div class="container hero-grid">
        <div class="hero-text">
          <p class="hero-meta" id="hero-role">載入中…</p>
          <h1 id="hero-name" class="hero-title">載入中…</h1>
          <p class="hero-tagline" id="hero-tagline"></p>
          <a class="btn btn-primary" href="#projects">查看作品集</a>
        </div>
        <div class="hero-photo">
          <div class="photo-frame corner-marks corner-marks--accent" id="photo-frame">
            <img id="profile-photo" alt="個人照片" />
          </div>
          <p class="photo-caption"></p>
        </div>
      </div>
    </section>

    <section id="skills" class="skills" aria-labelledby="skills-heading">
      <div class="container">
        <h2 id="skills-heading" class="section-title">技術能力</h2>
        <div id="skills-grid" class="skills-grid"></div>
      </div>
    </section>

    <section id="about" class="about" aria-labelledby="about-heading">
      <div class="container">
        <h2 id="about-heading" class="section-title">關於我</h2>
        <div class="about-lang-tabs">
          <button id="about-tab-zh" class="about-tab is-active" type="button" aria-controls="about-content-zh">中文版</button>
          <button id="about-tab-en" class="about-tab" type="button" aria-controls="about-content-en">English</button>
        </div>
        <div id="about-content-zh" class="about-content prose is-active" role="tabpanel" aria-labelledby="about-tab-zh">載入中…</div>
        <div id="about-content-en" class="about-content prose" role="tabpanel" aria-labelledby="about-tab-en" lang="en" hidden>載入中…</div>
      </div>
    </section>

    <section id="milestones" class="milestones" aria-labelledby="milestones-heading">
      <div class="container">
        <h2 id="milestones-heading" class="section-title">學習歷程</h2>
        <div class="milestones-layout">
          <ol id="milestones-list" class="milestones-timeline"></ol>
          <div id="milestones-map" class="milestones-map" aria-hidden="true"></div>
        </div>
      </div>
    </section>

    <section id="projects" class="projects" aria-labelledby="projects-heading">
      <div class="container">
        <h2 id="projects-heading" class="section-title">作品集</h2>
        <div id="projects-list" class="projects-list"></div>
      </div>
    </section>

    <section id="certificates" class="certificates" aria-labelledby="certificates-heading">
      <div class="container">
        <h2 id="certificates-heading" class="section-title">證照證書</h2>
        <div id="certificates-list" class="certificates-list"></div>
      </div>
    </section>

    <section id="contact" class="contact" aria-labelledby="contact-heading">
      <div class="container">
        <h2 id="contact-heading" class="section-title">聯絡我</h2>
        <ul id="contact-list" class="contact-list"></ul>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="js/markdown-lite.js"></script>
  <script src="js/load-components.js"></script>
  <script src="js/load-data.js"></script>
  <script src="js/shared-render.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
